    <clipPath id="screenClip"><rect x="67" y="55" width="729" height="1712" rx="72"/></clipPath>
    <style>
      .title { font: 700 58px -apple-system, BlinkMacSystemFont, "SF Pro Display", Arial, sans-serif; fill:#071c42; }
