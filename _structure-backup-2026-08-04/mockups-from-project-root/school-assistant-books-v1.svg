      .book-title { font: 700 27px -apple-system, BlinkMacSystemFont, "SF Pro Display", Arial, sans-serif; fill:#071c42; }
      .body { font: 500 22px -apple-system, BlinkMacSystemFont, "SF Pro Text", Arial, sans-serif; fill:#55658c; }
      .small { font: 500 18px -apple-system, BlinkMacSystemFont, "SF Pro Text", Arial, sans-serif; fill:#65749a; }
      .pill { font: 600 22px -apple-system, BlinkMacSystemFont, "SF Pro Text", Arial, sans-serif; fill:#59668c; }
      .button { font: 700 22px -apple-system, BlinkMacSystemFont, "SF Pro Text", Arial, sans-serif; fill:white; }
      .nav-label { font: 500 16px -apple-system, BlinkMacSystemFont, "SF Pro Text", Arial, sans-serif; fill:white; }
      .nav-active { fill:#ffd25f; }
      .line { fill:none; stroke:#071c42; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
    </style>
  </defs>

