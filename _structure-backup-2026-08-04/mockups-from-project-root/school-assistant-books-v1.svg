    <linearGradient id="bookCover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fa7e9"/>
      <stop offset="1" stop-color="#b99ddf"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#796d8c" flood-opacity="0.15"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="12" flood-color="#8290b1" flood-opacity="0.12"/>
