<svg xmlns="http://www.w3.org/2000/svg" width="863" height="1822" viewBox="0 0 863 1822">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf7fb"/>
      <stop offset="1" stop-color="#f6f8fc"/>
    </linearGradient>
    <linearGradient id="nav" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#08244a"/>
      <stop offset="1" stop-color="#041b3d"/>
    </linearGradient>
    <linearGradient id="robotCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f7f8"/>
      <stop offset="1" stop-color="#edf0ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#796d8c" flood-opacity="0.15"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="12" flood-color="#8290b1" flood-opacity="0.12"/>
    </filter>
    <clipPath id="screenClip"><rect x="67" y="55" width="729" height="1712" rx="72"/></clipPath>
    <style>
      .title { font: 700 58px -apple-system, BlinkMacSystemFont, "SF Pro Display", Arial, sans-serif; fill:#071c42; }
      .h2 { font: 700 33px -apple-system, BlinkMacSystemFont, "SF Pro Display", Arial, sans-serif; fill:#071c42; }
      .club-title { font: 700 34px -apple-system, BlinkMacSystemFont, "SF Pro Display", Arial, sans-serif; fill:#071c42; }
      .card-title { font: 700 27px -apple-system, BlinkMacSystemFont, "SF Pro Display", Arial, sans-serif; fill:#071c42; }
      .body { font: 500 22px -apple-system, BlinkMacSystemFont, "SF Pro Text", Arial, sans-serif; fill:#55658c; }
      .small { font: 500 18px -apple-system, BlinkMacSystemFont, "SF Pro Text", Arial, sans-serif; fill:#65749a; }
      .day { font: 600 18px -apple-system, BlinkMacSystemFont, "SF Pro Text", Arial, sans-serif; fill:#65749a; }
      .daynum { font: 700 22px -apple-system, BlinkMacSystemFont, "SF Pro Text", Arial, sans-serif; fill:#071c42; }
      .nav-label { font: 500 16px -apple-system, BlinkMacSystemFont, "SF Pro Text", Arial, sans-serif; fill:white; }
      .nav-active { fill:#ffd25f; }
      .line { fill:none; stroke:#071c42; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
    </style>
  </defs>

  <rect width="863" height="1822" fill="#fbf8fb"/>
  <rect x="45" y="28" width="773" height="1766" rx="94" fill="#17191d" filter="url(#shadow)"/>
  <rect x="55" y="39" width="753" height="1744" rx="84" fill="#020306"/>
  <g clip-path="url(#screenClip)">
    <rect x="67" y="55" width="729" height="1712" fill="url(#page)"/>
    <circle cx="102" cy="390" r="185" fill="#fff1ef" opacity="0.55"/>
    <circle cx="760" cy="910" r="230" fill="#eeeffe" opacity="0.48"/>

    <!-- iOS status bar -->
    <text x="125" y="111" font-family="-apple-system,Arial" font-size="25" font-weight="700" fill="#07142e">9:41</text>
    <rect x="343" y="72" width="178" height="48" rx="25" fill="#000"/>
    <circle cx="496" cy="96" r="7" fill="#0a579b"/>
    <g fill="#07142e">
      <rect x="645" y="96" width="5" height="14" rx="2"/><rect x="655" y="90" width="5" height="20" rx="2"/>
      <rect x="665" y="84" width="5" height="26" rx="2"/><rect x="675" y="78" width="5" height="32" rx="2"/>
      <path d="M692 88q20-18 40 0l-7 8q-13-12-26 0z"/>
      <rect x="740" y="82" width="39" height="25" rx="6" fill="none" stroke="#07142e" stroke-width="3"/>
      <rect x="779" y="89" width="4" height="11" rx="2"/><rect x="744" y="86" width="29" height="17" rx="3"/>
    </g>

    <!-- header -->
    <text class="title" x="108" y="221">Кружки</text>
    <rect x="609" y="162" width="145" height="92" rx="28" fill="#fff0c4" stroke="#ffe19a"/>
    <text x="632" y="225" font-family="-apple-system,Arial" font-size="48" font-weight="700" fill="#071c42">12</text>
    <path d="M714 182l8 16 18 2-13 13 3 18-16-8-16 8 3-18-13-13 18-2z" fill="#ffb51d"/>

    <!-- week selector -->
    <g>
      <rect x="108" y="288" width="646" height="110" rx="32" fill="#f8f6fd" stroke="#ddd8ec" stroke-width="2"/>
      <rect x="122" y="299" width="108" height="88" rx="27" fill="#fff0cf" stroke="#f4b342" stroke-width="2"/>
      <text class="day" x="176" y="327" text-anchor="middle" fill="#9b6c10">Пн</text><text class="daynum" x="176" y="365" text-anchor="middle">3</text>
      <text class="day" x="278" y="327" text-anchor="middle">Вт</text><text class="daynum" x="278" y="365" text-anchor="middle">4</text>
      <text class="day" x="381" y="327" text-anchor="middle">Ср</text><text class="daynum" x="381" y="365" text-anchor="middle">5</text>
      <text class="day" x="484" y="327" text-anchor="middle">Чт</text><text class="daynum" x="484" y="365" text-anchor="middle">6</text>
      <text class="day" x="587" y="327" text-anchor="middle">Пт</text><text class="daynum" x="587" y="365" text-anchor="middle">7</text>
      <text class="day" x="690" y="327" text-anchor="middle">Сб</text><text class="daynum" x="690" y="365" text-anchor="middle">8</text>
    </g>

    <!-- next club -->
    <text class="h2" x="108" y="461">Сегодня</text>
    <rect x="108" y="493" width="646" height="381" rx="38" fill="url(#robotCard)" stroke="#bfe0e5" stroke-width="2" filter="url(#soft)"/>
    <rect x="138" y="526" width="129" height="43" rx="20" fill="#d4eff0"/>
    <text x="202" y="554" text-anchor="middle" font-family="-apple-system,Arial" font-size="17" font-weight="700" fill="#278b90">Ближайшее</text>
    <text class="club-title" x="138" y="626">Робототехника</text>
    <g transform="translate(138 655)">
      <circle cx="15" cy="15" r="12" fill="none" stroke="#596b99" stroke-width="4"/>
      <path d="M15 7v9l6 4" fill="none" stroke="#596b99" stroke-width="4" stroke-linecap="round"/>
      <text class="body" x="43" y="22">17:00–18:30</text>
    </g>
    <g transform="translate(138 709)">
      <path d="M15 1c-8 0-13 6-13 14 0 10 13 22 13 22s13-12 13-22C28 7 23 1 15 1z" fill="none" stroke="#596b99" stroke-width="4"/>
      <circle cx="15" cy="15" r="4" fill="#596b99"/>
      <text class="body" x="43" y="23">Детский центр</text>
    </g>
    <rect x="138" y="773" width="348" height="68" rx="24" fill="#ffffff" opacity="0.86"/>
    <path d="M170 799c0-10 7-18 17-18s17 8 17 18v8l8 9h-50l8-9zm10 22q7 10 14 0" fill="none" stroke="#596b99" stroke-width="4" stroke-linejoin="round"/>
    <text x="225" y="815" font-family="-apple-system,Arial" font-size="19" font-weight="700" fill="#52658f">Напомним в 16:30</text>

    <!-- soft robot illustration -->
    <g transform="translate(520 558)">
      <path d="M76 25V5" stroke="#7689b7" stroke-width="6" stroke-linecap="round"/><circle cx="76" cy="0" r="9" fill="#ffcb61"/>
      <rect x="23" y="24" width="106" height="88" rx="30" fill="#d7e3f7" stroke="#7587b0" stroke-width="4"/>
      <rect x="35" y="39" width="82" height="52" rx="20" fill="#142b51"/>
      <circle cx="60" cy="65" r="8" fill="#87dde0"/><circle cx="93" cy="65" r="8" fill="#87dde0"/>
      <rect x="42" y="112" width="69" height="82" rx="25" fill="#c3d8ee" stroke="#7587b0" stroke-width="4"/>
      <rect x="57" y="132" width="40" height="25" rx="10" fill="#8bd1d3"/>
      <path d="M42 130L9 151M111 130l32 21" stroke="#7587b0" stroke-width="12" stroke-linecap="round"/>
      <circle cx="8" cy="151" r="13" fill="#ffcf72"/><circle cx="144" cy="151" r="13" fill="#ffcf72"/>
      <path d="M61 193v26M92 193v26" stroke="#7587b0" stroke-width="12" stroke-linecap="round"/>
