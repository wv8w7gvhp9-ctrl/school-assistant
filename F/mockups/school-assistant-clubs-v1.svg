    <!-- what to bring -->
    <text class="h2" x="108" y="942">Что взять с собой</text>
    <rect x="108" y="974" width="646" height="230" rx="36" fill="#fff6e5" stroke="#f3d7a5" stroke-width="2"/>
    <g transform="translate(140 1012)">
      <rect x="0" y="0" width="286" height="70" rx="25" fill="#ffffff" opacity="0.85"/>
      <circle cx="38" cy="35" r="17" fill="#ffcc67"/><path d="M29 35l7 7 13-16" class="line"/>
      <text class="body" x="72" y="43" fill="#071c42">Тетрадь</text>
    </g>
    <g transform="translate(438 1012)">
      <rect x="0" y="0" width="284" height="70" rx="25" fill="#ffffff" opacity="0.85"/>
      <circle cx="38" cy="35" r="17" fill="#ffcc67"/><path d="M29 35l7 7 13-16" class="line"/>
      <text class="body" x="72" y="43" fill="#071c42">Ручка</text>
    </g>
    <g transform="translate(140 1095)">
      <rect x="0" y="0" width="582" height="78" rx="25" fill="#ffffff" opacity="0.85"/>
      <circle cx="38" cy="39" r="17" fill="#ffcc67"/><path d="M29 39l7 7 13-16" class="line"/>
      <text class="body" x="72" y="47" fill="#071c42">Набор для занятий</text>
    </g>

    <!-- weekly schedule -->
    <text class="h2" x="108" y="1276">Расписание кружков</text>
    <rect x="108" y="1308" width="646" height="220" rx="36" fill="#f2effd" stroke="#d7d0ee" stroke-width="2"/>
    <rect x="139" y="1340" width="91" height="91" rx="28" fill="#d8d2f4"/>
    <circle cx="184" cy="1384" r="26" fill="#ffffff" opacity="0.8"/>
    <path d="M172 1395v-24h24v24M177 1371v-11h14v11M178 1382h3m7 0h3" class="line"/>
    <text class="card-title" x="258" y="1369">Робототехника</text>
    <text class="body" x="258" y="1406">Каждый понедельник</text>
    <text x="258" y="1453" font-family="-apple-system,Arial" font-size="23" font-weight="700" fill="#5c6fb0">17:00–18:30</text>
    <rect x="610" y="1380" width="106" height="54" rx="22" fill="#dcd5f7"/>
    <text x="663" y="1415" text-anchor="middle" font-family="-apple-system,Arial" font-size="18" font-weight="700" fill="#6658a7">Пн</text>

    <!-- bottom navigation -->
    <rect x="79" y="1583" width="705" height="184" rx="55" fill="url(#nav)"/>
    <g transform="translate(142 1614)">
      <path d="M0 31l24-20 24 20v30H33V42H15v19H0z" fill="none" stroke="white" stroke-width="5" stroke-linejoin="round"/>
      <text class="nav-label" x="24" y="94" text-anchor="middle">Сегодня</text>
    </g>
    <g transform="translate(270 1614)">
      <rect x="2" y="17" width="44" height="42" rx="8" fill="none" stroke="white" stroke-width="5"/>
      <path d="M2 30h44M13 10v14M35 10v14" stroke="white" stroke-width="5" stroke-linecap="round"/>
      <circle cx="15" cy="43" r="3" fill="white"/><circle cx="32" cy="43" r="3" fill="white"/>
      <text class="nav-label" x="24" y="94" text-anchor="middle">Расписание</text>
    </g>
    <g transform="translate(409 1614)">
      <rect x="5" y="15" width="39" height="48" rx="7" fill="none" stroke="white" stroke-width="5"/>
      <path d="M15 15v-6h19v6M15 35l6 6 13-15" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="nav-label" x="24" y="94" text-anchor="middle">Домашка</text>
    </g>
    <g transform="translate(548 1614)">
      <path d="M1 27q22-11 23 7v29q-11-10-23-4zm46 0q-22-11-23 7v29q11-10 23-4z" fill="none" stroke="white" stroke-width="5" stroke-linejoin="round"/>
      <text class="nav-label" x="24" y="94" text-anchor="middle">Книги</text>
    </g>
    <g transform="translate(687 1599)">
      <circle cx="25" cy="39" r="38" fill="#ffd16a"/>
      <path d="M7 14h36v13c0 15-8 28-18 28S7 42 7 27zM7 21H0v8c0 8 5 13 12 13M43 21h7v8c0 8-5 13-12 13M16 66h18M25 55v11" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="nav-label nav-active" x="25" y="109" text-anchor="middle">Кружки</text>
    </g>
  </g>
  <rect x="67" y="55" width="729" height="1712" rx="72" fill="none" stroke="#42454b" stroke-width="2"/>
</svg>
